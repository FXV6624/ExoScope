name: Playwright Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - backend/**
              - frontend/**
              - .env
              - compose*.yml
              - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      - name: Install Playwright Chromium & System Dependencies
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Backend Services
        run: docker compose up -d backend db redis mailcatcher proxy --wait

      - name: Build Frontend
        run: bun run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000

      - name: Inspect backend logs on failure
        if: failure()
        run: |
          docker compose logs db
          docker compose logs backend
          docker compose logs prestart

      - name: Run Playwright tests
        run: bunx playwright test
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
          MAILCATCHER_HOST: http://localhost:1080
          CI: "true"

      - name: Stop backend containers
        if: always()
        run: docker compose down -v

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 30
