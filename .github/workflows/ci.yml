name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker compose build backend

      - name: Start services and wait for healthcheck
        run: docker compose up -d backend db redis proxy --wait

      - name: Inspect backend logs on failure
        if: failure()
        run: |
          docker compose logs db
          docker compose logs backend
          docker compose logs prestart

      - name: Run Backend tests with Coverage
        run: |
          docker compose exec -T backend coverage run -m pytest
          docker compose exec -T backend coverage report
          docker compose exec -T backend coverage html

      - name: Upload Coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/htmlcov
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker compose down
