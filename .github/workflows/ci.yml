name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start services and wait for healthcheck
        run: docker compose up -d backend db redis proxy --wait

      - name: Inspect backend logs on failure
        if: failure()
        run: |
          docker compose logs db
          docker compose logs backend
          docker compose logs prestart

      - name: Run Backend tests with Coverage
        run: |
          docker compose exec -T backend coverage run -m pytest
          docker compose exec -T backend coverage report
          docker compose exec -T backend coverage html

      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/

      - name: Stop containers
        if: always()
        run: docker compose down
