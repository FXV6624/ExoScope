[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "fastapi-cache2>=0.2.2",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "redis>=8.1.0",
    "zizmor>=1.23.1",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
